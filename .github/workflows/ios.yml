
name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ProjectFernet
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Verify Project
        run: |
          test -d ProjectFernet.xcodeproj
          xcodebuild -list -project ProjectFernet.xcodeproj

      - name: Build iOS App
        run: |
          set -euo pipefail

          xcodebuild \
            -project ProjectFernet.xcodeproj \
            -scheme ProjectFernet \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectFernet-Build
          path: build/DerivedData/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7
