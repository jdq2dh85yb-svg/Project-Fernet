
name: Check iOS Signing

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Apple Signing Credentials
    runs-on: macos-15

    steps:
      - name: Check required secrets
        env:
          P12: ${{ secrets.P12_BASE64 }}
          PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$P12" || {
            echo "Missing P12_BASE64"
            exit 1
          }

          test -n "$PASSWORD" || {
            echo "Missing P12_PASSWORD"
            exit 1
          }

          test -n "$PROFILE" || {
            echo "Missing MOBILEPROVISION_BASE64"
            exit 1
          }

          echo "All required secrets are present."

      - name: Decode certificate
        env:
          P12: ${{ secrets.P12_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          test -s "$RUNNER_TEMP/certificate.p12"

      - name: Verify certificate password
        env:
          PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          openssl pkcs12 \
            -in "$RUNNER_TEMP/certificate.p12" \
            -passin env:PASSWORD \
            -noout

          echo "P12 password is valid."

      - name: Verify provisioning profile
        env:
          PROFILE: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$PROFILE" | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "Provisioning profile is valid."

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
