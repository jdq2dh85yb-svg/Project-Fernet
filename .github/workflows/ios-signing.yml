
name: ProjectFernet - Signed IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Decode Signing Files
        env:
          P12: ${{ secrets.P12_BASE64 }}
          PROFILE: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$P12"
          test -n "$PROFILE"

          mkdir -p "$RUNNER_TEMP/signing"

          printf '%s' "$P12" | base64 --decode \
            > "$RUNNER_TEMP/signing/certificate.p12"

          printf '%s' "$PROFILE" | base64 --decode \
            > "$RUNNER_TEMP/signing/profile.mobileprovision"

      - name: Create Temporary Keychain
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/signing/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user -s "$KEYCHAIN"

          security default-keychain \
            -d user -s "$KEYCHAIN"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Verify Signing Identity
        run: |
          set -euo pipefail

          security find-identity \
            -v -p codesigning "$KEYCHAIN"

          COUNT=$(security find-identity \
            -v -p codesigning "$KEYCHAIN" \
            | grep -c '"Apple ' || true)

          if [ "$COUNT" -lt 1 ]; then
            echo "No valid Apple signing identity found."
            exit 1
          fi

      - name: Install Provisioning Profile
        run: |
          set -euo pipefail

          PROFILE="$RUNNER_TEMP/signing/profile.mobileprovision"

          security cms -D -i "$PROFILE" \
            > "$RUNNER_TEMP/signing/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/signing/profile.plist")

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/signing/profile.plist")

          APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/signing/profile.plist")

          BUNDLE_ID="app.projectfernet.launcher"

          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ] && \
             [ "$APP_ID" != "$TEAM_ID.*" ]; then
            echo "Provisioning Profile Bundle ID does not match."
            echo "Profile: $APP_ID"
            echo "Expected: $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Profile installed successfully."
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Determine Export Method
        run: |
          set -euo pipefail

          PLIST="$RUNNER_TEMP/signing/profile.plist"

          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:get-task-allow" \
            "$PLIST")

          if [ "$GET_TASK_ALLOW" = "true" ]; then
            METHOD="development"
          elif /usr/libexec/PlistBuddy \
            -c "Print :ProvisionsAllDevices" "$PLIST" \
            >/dev/null 2>&1; then
            METHOD="enterprise"
          elif /usr/libexec/PlistBuddy \
            -c "Print :ProvisionedDevices" "$PLIST" \
            >/dev/null 2>&1; then
            METHOD="ad-hoc"
          else
            METHOD="app-store-connect"
          fi

          echo "EXPORT_METHOD=$METHOD" >> "$GITHUB_ENV"
          echo "Export method: $METHOD"

      - name: Archive ProjectFernet
        run: |
          set -euo pipefail

          xcodebuild \
            -project ProjectFernet.xcodeproj \
            -scheme ProjectFernet \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ProjectFernet.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="app.projectfernet.launcher" \
            archive

      - name: Export Signed IPA
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.projectfernet.launcher</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ProjectFernet.xcarchive" \
            -exportPath "$RUNNER_TEMP/IPA" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA=$(find "$RUNNER_TEMP/IPA" \
            -maxdepth 1 -name "*.ipa" -type f | head -n 1)

          test -n "$IPA"

          mkdir -p build
          cp "$IPA" build/ProjectFernet.ipa

          unzip -t build/ProjectFernet.ipa
          shasum -a 256 build/ProjectFernet.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectFernet-IPA
          path: build/ProjectFernet.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="projectfernet-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            build/ProjectFernet.ipa \
            --title "ProjectFernet Build $GITHUB_RUN_NUMBER" \
            --notes "Automatically built and signed ProjectFernet IPA." \
            --target "$GITHUB_SHA"

      - name: Cleanup Signing Files
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true

          rm -rf "$RUNNER_TEMP/signing"
          rm -rf "$RUNNER_TEMP/IPA"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
